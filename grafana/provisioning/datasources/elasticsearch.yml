apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: true
    jsonData:
      database: "store-app-logs-*"
      timeField: "timestamp"
      esVersion: "8.11.0"
      interval: "Daily"
      logMessageField: "message"
      logLevelField: "level"
