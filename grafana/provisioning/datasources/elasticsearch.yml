apiVersion: 1

datasources:
  - name: Elasticsearch
    uid: elasticsearch-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: true
    jsonData:
      index: "[store-app-logs-]YYYY.MM.DD"
      interval: "Daily"
      timeField: "@timestamp"
      esVersion: "8.11.0"
      logMessageField: "message"
      logLevelField: "level"

